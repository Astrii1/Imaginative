  - legal_materials
  - cityscapes
  - cinematic_video

observations:
  typography:
    - large restrained headlines
    - minimal typographic clutter
    - confident editorial hierarchy

  layout:
    - large visual compositions
    - generous negative space
    - minimal navigation
    - content-led rather than component-led

  imagery:
    - cinematic environmental footage
    - architecture used to communicate scale and permanence
    - professionals shown in authentic working environments
    - legal objects used as contextual signals rather than decoration

  interaction:
    - restrained animation
    - cinematic transitions
    - minimal visible controls

